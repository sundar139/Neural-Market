# Short-run smoke config for the production-shaped integration test.
# Reduces epochs/patience only; architecture and seeds are v1-frozen.
version: signature-neural-sde-v1-short-smoke

sde:
  state_dim: 2
  brownian_dim: 2
  n_context: 4
  hidden_units: 32
  hidden_layers: 1
  activation: SiLU
  diffusion_epsilon: 1.0e-6
  dt: 0.003968253968253968
  horizon: 63
  signature_level: 3

training:
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 1.0e-6
  batch_size: 64
  max_epochs: 6
  patience: 6
  grad_norm_clip: 1.0
  model_init_seed: 4242
  data_seed: 4243
  eval_seed: 4244
  fit_fraction: 0.8

windows:
  context_lookback: 22
  horizon: 63
  dt: 0.003968253968253968

n_eval_paths: 1024
eval_seed: 4244