# Neural-SDE internal gate specification v2.
# Replaces the overlapping-window terminal estimator with a
# dependence-preserving bootstrap reference distribution.
# Frozen BEFORE v5 training. No v4-derived thresholds.
version: neural-sde-internal-gate-v2

bootstrap:
  method: block                    # circular moving-block bootstrap
  block_length: 22                 # one trading month, matches frozen convention
  real_source: internal_selection  # only selection-period real returns
  terminal_path_count: 1024        # real bootstrap paths
  generated_path_count: 1024       # generated paths (must match real)
  horizon: 63                      # trading days
  seed: 8801                       # frozen gate seed, distinct from model seeds

terminal_dispersion:
  metric: std_ratio                # std_generated / std_real_bootstrap
  band_lo: 0.50
  band_hi: 2.00
  status: pass_fail

terminal_distribution:
  metric: normalized_wasserstein
  normalization: real_bootstrap_std
  status: report_only              # no frozen threshold yet

serial_dependence:
  lags: [1, 2, 3, 5, 10, 20]
  acf1:
    status: pass_fail              # pre-v4 criterion, independent provenance
    threshold: 0.25                # |acf_real(1) - acf_gen(1)| <= 0.25
  rmse:
    status: report_only            # no independent derivation; report only
    diagnostic_reference: 0.15     # informational, not acceptance criterion
  max_error:
    status: report_only            # no independent derivation; report only
    diagnostic_reference: 0.25     # informational, not acceptance criterion

volatility_clustering:
  lags: [1, 2, 3, 5, 10, 20]
  metrics: [abs_return_acf, sq_return_acf]
  status: report_only              # no pass/fail threshold yet

conditional_variance:
  context_feature: prev_22d_realized_volatility
  metric: correlation_log_variance
  status: report_only              # no pass/fail threshold yet

variance_ratio:
  band_lo: 0.50
  band_hi: 2.00
  status: pass_fail

path_uniqueness:
  min_fraction: 0.99
  status: pass_fail

drift_diffusion_ratio:
  max_ratio: 0.50
  status: pass_fail
