# Signature neural-SDE v1 -- FROZEN experiment configuration.
# Frozen BEFORE any external-validation observation. Do not tune on
# validation results; any later change requires a predeclared v2 protocol.
version: signature-neural-sde-v1

sde:
  state_dim: 2          # x: observable cumulative log return; z: latent state
  brownian_dim: 2
  n_context: 4
  hidden_units: 64
  hidden_layers: 2
  activation: SiLU
  diffusion_epsilon: 1.0e-6   # softplus(raw) + eps; diffusion always positive
  dt: 0.003968253968253968    # 1/252
  horizon: 63                 # matching the frozen baseline suite
  signature_level: 3          # truncated signature levels 1..3

training:
  optimizer: AdamW
  learning_rate: 0.001
  weight_decay: 1.0e-6
  batch_size: 64
  max_epochs: 400
  patience: 40
  grad_norm_clip: 1.0
  model_init_seed: 4242
  data_seed: 4243
  eval_seed: 4244
  fit_fraction: 0.8

windows:
  context_lookback: 22
  horizon: 63
  dt: 0.003968253968253968

n_eval_paths: 1024
eval_seed: 4244
